<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="通导题库">
<meta name="theme-color" content="#007aff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>通导理论题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--gray:#aeaeb2;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;
  overflow:hidden;display:flex;flex-direction:column;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
}
#app{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
.screen{display:none;animation:fade .2s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Header */
.header{
  position:sticky;top:0;z-index:10;background:rgba(242,242,247,.85);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;
}
.header h1{font-size:17px;font-weight:600;flex:1;text-align:center;}
.header .back{font-size:16px;color:var(--blue);background:none;border:none;padding:4px 8px;}
.header .right{font-size:15px;color:var(--blue);background:none;border:none;padding:4px 8px;}
/* Home */
.home{padding:16px;}
.section{margin-bottom:20px;}
.section-title{font-size:13px;color:var(--sub);padding:0 4px 8px;text-transform:uppercase;letter-spacing:.5px;}
.card{background:var(--card);border-radius:12px;overflow:hidden;}
.row{display:flex;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--line);cursor:pointer;}
.row:last-child{border-bottom:none;}
.row:active{background:#f9f9fb;}
.row .label{flex:1;font-size:16px;}
.row .count{color:var(--sub);font-size:14px;margin-right:8px;}
.row .arrow{color:var(--gray);font-size:18px;}
.row.selected{color:var(--blue);}
.row.selected .arrow{color:var(--blue);}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;}
.chip{padding:8px 14px;border-radius:20px;font-size:14px;background:#e9e9ed;color:var(--text);border:none;}
.chip.active{background:var(--blue);color:#fff;}
.btn{
  display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;
  background:var(--blue);color:#fff;margin-top:12px;
}
.btn:active{opacity:.7;}
.btn.green{background:var(--green);}
.btn.orange{background:var(--orange);}
.btn.gray{background:#e9e9ed;color:var(--text);}
.btn:disabled{opacity:.4;}
/* Quiz */
.quiz-wrap{padding:16px;}
.progress-bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden;}
.progress-bar .fill{height:100%;background:var(--blue);transition:width .25s;}
.meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:#e9e9ed;color:var(--sub);}
.tag.diff-易{background:#d4f5d4;color:#248a3d;}
.tag.diff-中{background:#fff3d6;color:#a06a00;}
.tag.diff-难{background:#fdd8d6;color:#c0392b;}
.question{font-size:17px;font-weight:500;line-height:1.6;margin-bottom:18px;word-break:break-word;}
.options{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:10px;
  background:var(--card);border:1.5px solid var(--line);cursor:pointer;font-size:16px;
  text-align:left;
}
.opt:active{background:#f5f5f7;}
.opt .letter{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#e9e9ed;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;}
.opt.selected{border-color:var(--blue);background:#e8f1ff;}
.opt.selected .letter{background:var(--blue);color:#fff;}
.opt.correct{border-color:var(--green);background:#e8f8ec;}
.opt.correct .letter{background:var(--green);color:#fff;}
.opt.wrong{border-color:var(--red);background:#fde9e8;}
.opt.wrong .letter{background:var(--red);color:#fff;}
.opt-text{flex:1;padding-top:2px;word-break:break-word;}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px;display:none;}
.feedback.show{display:block;}
.feedback.right{background:#e8f8ec;color:#248a3d;}
.feedback.wrong{background:#fde9e8;color:#c0392b;}
.feedback .ans{font-weight:600;}
.actions{display:flex;gap:10px;margin-top:18px;}
.actions .btn{margin:0;flex:1;}
/* Result */
.result{padding:20px;text-align:center;}
.score-circle{width:160px;height:160px;border-radius:50%;background:var(--card);margin:20px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.score-circle .num{font-size:42px;font-weight:700;color:var(--blue);}
.score-circle .lbl{font-size:13px;color:var(--sub);}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0;}
.result-stats .stat .n{font-size:22px;font-weight:600;}
.result-stats .stat .l{font-size:12px;color:var(--sub);}
/* Empty */
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px;}
/* Stats */
.stats{padding:16px;}
.stat-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
.stat-card .big{font-size:32px;font-weight:700;color:var(--blue);}
.stat-card .sm{font-size:13px;color:var(--sub);}
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="header"><h1>通导理论题库</h1></div>
    <div class="home">
      <div class="section">
        <div class="section-title">选择题库</div>
        <div class="card" id="catList"></div>
      </div>
      <div class="section">
        <div class="section-title">题型</div>
        <div class="card">
          <div class="chip-group" id="typeGroup">
            <button class="chip active" data-v="">全部</button>
            <button class="chip" data-v="单选题">单选题</button>
            <button class="chip" data-v="判断题">判断题</button>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">难度</div>
        <div class="card">
          <div class="chip-group" id="diffGroup">
            <button class="chip active" data-v="">全部</button>
            <button class="chip" data-v="易">易</button>
            <button class="chip" data-v="中">中</button>
            <button class="chip" data-v="难">难</button>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">练习模式</div>
        <button class="btn" id="btnOrder">顺序练习</button>
        <button class="btn green" id="btnRandom">随机练习</button>
        <button class="btn orange" id="btnExam">模拟考试 <span id="examCnt" style="font-size:13px;opacity:.85"></span></button>
        <button class="btn gray" id="btnWrong">错题本 <span id="wrongCnt" style="font-size:13px;opacity:.85"></span></button>
        <button class="btn gray" id="btnStats">学习统计</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen">
    <div class="header">
      <button class="back" id="qBack">‹ 退出</button>
      <h1 id="qTitle">练习</h1>
      <button class="right" id="qFav">☆</button>
    </div>
    <div class="quiz-wrap">
      <div class="progress-bar"><div class="fill" id="qFill"></div></div>
      <div class="meta" id="qMeta"></div>
      <div class="question" id="qText"></div>
      <div class="options" id="qOpts"></div>
      <div class="feedback" id="qFb"></div>
      <div class="actions">
        <button class="btn gray" id="qPrev">上一题</button>
        <button class="btn" id="qNext">下一题</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="header"><h1>考试结果</h1></div>
    <div class="result">
      <div class="score-circle"><div class="num" id="rScore">0</div><div class="lbl">得分</div></div>
      <div class="result-stats">
        <div class="stat"><div class="n" id="rRight" style="color:var(--green)">0</div><div class="l">正确</div></div>
        <div class="stat"><div class="n" id="rWrong" style="color:var(--red)">0</div><div class="l">错误</div></div>
        <div class="stat"><div class="n" id="rTotal">0</div><div class="l">总题数</div></div>
      </div>
      <button class="btn" id="rReview">查看错题</button>
      <button class="btn gray" id="rHome">返回首页</button>
    </div>
  </div>

  <!-- STATS -->
  <div id="stats" class="screen">
    <div class="header"><button class="back" onclick="show('home')">‹ 返回</button><h1>学习统计</h1></div>
    <div class="stats" id="statsBody"></div>
  </div>
</div>

<script>
const STORE = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
};
let state = {
  cat:'公共知识', sub:'', type:'', diff:'',
  list:[], idx:0, mode:'order', answered:{}, wrongs:STORE.get('wrongs',{}),
  favs:STORE.get('favs',{}), examWrongs:[],
};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('app').scrollTop=0;}

// build category list
function buildCats(){
  const cats={};
  QUESTIONS.forEach(([c,s])=>{cats[c]=cats[c]||new Set();cats[c].add(s);});
  const el=document.getElementById('catList');
  el.innerHTML='';
  Object.keys(cats).forEach(c=>{
    const subs=[...cats[c]];
    const cnt=QUESTIONS.filter(q=>q[0]===c).length;
    const row=document.createElement('div');
    row.className='row'+(state.cat===c?' selected':'');
    row.innerHTML=`<div class="label">${c}</div><div class="count">${cnt}题</div><div class="arrow">›</div>`;
    row.onclick=()=>{state.cat=c;state.sub='';buildCats();};
    el.appendChild(row);
    subs.forEach(s=>{
      const sc=QUESTIONS.filter(q=>q[0]===c&&q[1]===s).length;
      const sr=document.createElement('div');
      sr.className='row'+(state.sub===s?' selected':'');
      sr.style.paddingLeft='36px';
      sr.innerHTML=`<div class="label">${s}</div><div class="count">${sc}题</div><div class="arrow">›</div>`;
      sr.onclick=()=>{state.cat=c;state.sub=state.sub===s?'':s;buildCats();};
      el.appendChild(sr);
    });
  });
  document.getElementById('wrongCnt').textContent=`(${Object.keys(state.wrongs).length})`;
  const ec=Math.min(100, filteredList().length);
  document.getElementById('examCnt').textContent=`(${ec}题)`;
}

function filteredList(){
  return QUESTIONS.filter(([c,s,t,d])=>
    c===state.cat && (!state.sub||s===state.sub) && (!state.type||t===state.type) && (!state.diff||d===state.diff)
  );
}

function chipGroup(id,key){
  document.querySelectorAll(`#${id} .chip`).forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll(`#${id} .chip`).forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state[key]=b.dataset.v;
      buildCats();
    };
  });
}

function start(mode){
  const list=filteredList();
  if(list.length===0){alert('该筛选条件下没有题目');return;}
  state.mode=mode;
  state.answered={};
  state.examWrongs=[];
  if(mode==='random'){
    state.list=[...list].sort(()=>Math.random()-0.5);
  } else if(mode==='exam'){
    const n=Math.min(100,list.length);
    state.list=[...list].sort(()=>Math.random()-0.5).slice(0,n);
  } else if(mode==='wrong'){
    const wkeys=Object.keys(state.wrongs);
    state.list=QUESTIONS.filter((_,i)=>wkeys.includes(String(i)));
    if(state.list.length===0){alert('错题本为空');return;}
  } else {
    state.list=list;
  }
  state.idx=0;
  document.getElementById('qTitle').textContent = mode==='exam'?'模拟考试':(mode==='wrong'?'错题练习':'练习');
  show('quiz');
  renderQ();
}

function qKey(q){return q[0]+'|'+q[1]+'|'+q[4]+'|'+q[6];}

function renderQ(){
  const q=state.list[state.idx];
  const [c,s,t,d,text,opts,ans]=q;
  const total=state.list.length;
  document.getElementById('qFill').style.width=((state.idx+1)/total*100)+'%';
  document.getElementById('qMeta').innerHTML=
    `<span class="tag">${state.idx+1}/${total}</span><span class="tag">${t}</span><span class="tag diff-${d}">${d}</span><span class="tag">${s}</span>`;
  document.getElementById('qText').textContent=text;
  const optsEl=document.getElementById('qOpts');
  optsEl.innerHTML='';
  const fb=document.getElementById('qFb');
  fb.className='feedback';fb.textContent='';
  const key=qKey(q);
  const done=state.answered[key];
  if(t==='判断题'){
    ['对','错'].forEach((v,i)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML=`<div class="letter">${['A','B'][i]}</div><div class="opt-text">${v}</div>`;
      b.onclick=()=>answer(v);
      if(done){
        if(v===ans)b.classList.add('correct');
        if(v===done.sel&&v!==ans)b.classList.add('wrong');
      }
      optsEl.appendChild(b);
    });
  } else {
    opts.split('|').forEach(o=>{
      const [letter,...rest]=o.split(':');
      const txt=rest.join(':');
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML=`<div class="letter">${letter}</div><div class="opt-text">${txt}</div>`;
      b.onclick=()=>answer(letter);
      if(done){
        if(letter===ans)b.classList.add('correct');
        if(letter===done.sel&&letter!==ans)b.classList.add('wrong');
      }
      optsEl.appendChild(b);
    });
  }
  if(done){
    const ok=done.sel===ans;
    fb.classList.add('show',ok?'right':'wrong');
    fb.innerHTML=ok?'<span class="ans">✓ 回答正确</span>':`<span class="ans">✗ 回答错误</span>，正确答案：<b>${ans}</b>`;
  }
  // fav
  const isFav=state.favs[key];
  document.getElementById('qFav').textContent=isFav?'★':'☆';
  document.getElementById('qFav').style.color=isFav?'var(--orange)':'var(--gray)';
}

function answer(sel){
  const q=state.list[state.idx];
  const [,,,,,opts,ans]=q;
  const key=qKey(q);
  if(state.answered[key])return;
  state.answered[key]={sel};
  if(sel!==ans){
    state.wrongs[QUESTIONS.indexOf(q)]=1;
    STORE.set('wrongs',state.wrongs);
    if(state.mode==='exam')state.examWrongs.push(state.idx);
  }
  renderQ();
}

document.getElementById('qNext').onclick=()=>{
  if(state.idx<state.list.length-1){state.idx++;renderQ();}
  else if(state.mode==='exam'){finishExam();}
};
document.getElementById('qPrev').onclick=()=>{if(state.idx>0){state.idx--;renderQ();}};
document.getElementById('qBack').onclick=()=>{
  if(state.mode==='exam'){if(confirm('确定交卷吗？'))finishExam();}
  else show('home');
};
document.getElementById('qFav').onclick=()=>{
  const q=state.list[state.idx];const key=qKey(q);
  if(state.favs[key])delete state.favs[key];else state.favs[key]=1;
  STORE.set('favs',state.favs);renderQ();
};

function finishExam(){
  let right=0;
  state.list.forEach(q=>{const d=state.answered[qKey(q)];if(d&&d.sel===q[6])right++;});
  const total=state.list.length;
  document.getElementById('rScore').textContent=Math.round(right/total*100);
  document.getElementById('rRight').textContent=right;
  document.getElementById('rWrong').textContent=total-right;
  document.getElementById('rTotal').textContent=total;
  show('result');
}
document.getElementById('rHome').onclick=()=>{buildCats();show('home');};
document.getElementById('rReview').onclick=()=>{
  state.mode='wrong';state.idx=0;state.list=state.examWrongs.map(i=>state.list[i]);
  if(state.list.length===0){alert('本次考试全部正确，没有错题！');show('home');return;}
  document.getElementById('qTitle').textContent='考试错题';
  show('quiz');renderQ();
};

document.getElementById('btnOrder').onclick=()=>start('order');
document.getElementById('btnRandom').onclick=()=>start('random');
document.getElementById('btnExam').onclick=()=>start('exam');
document.getElementById('btnWrong').onclick=()=>start('wrong');
document.getElementById('btnStats').onclick=showStats;

function showStats(){
  const wrongs=Object.keys(state.wrongs).length;
  const favs=Object.keys(state.favs).length;
  // count answered from wrongs/favs approx; we track via wrongs only
  const total=QUESTIONS.length;
  const rightRate = wrongs===0?100:Math.max(0,100-Math.round(wrongs/total*100));
  document.getElementById('statsBody').innerHTML=`
    <div class="stat-card"><div class="big">${total}</div><div class="sm">题库总题数</div></div>
    <div class="stat-card"><div class="big" style="color:var(--red)">${wrongs}</div><div class="sm">错题本数量</div></div>
    <div class="stat-card"><div class="big" style="color:var(--orange)">${favs}</div><div class="sm">收藏题目数</div></div>
    <div class="stat-card"><div class="big" style="color:var(--green)">${rightRate}%</div><div class="sm">整体正确率（估算）</div></div>
    <button class="btn gray" onclick="if(confirm('清空错题本？')){state.wrongs={};STORE.set('wrongs',{});buildCats();showStats();}">清空错题本</button>
  `;
  show('stats');
}

// init
buildCats();
chipGroup('typeGroup','type');
chipGroup('diffGroup','diff');

// register service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
